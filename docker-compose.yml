version: '3.8'

# ── Clasificador de Lesiones Cutáneas — UTN FRLP 2026 ─────────────────────────
#
# Flujo automático con "docker-compose up --build":
#   1. Si no hay dataset  → lo descarga de Google Drive (~3 GB)
#   2. Si no hay modelo   → lo entrena con el dataset (~5-10 min)
#   3. Lanza la app en    http://localhost:7860
#
# Comandos:
#   docker-compose up --build   # Primera vez (descarga + entrena + lanza)
#   docker-compose up           # Siguientes veces (modelo ya guardado)
#   docker-compose down         # Detener
#   docker-compose down -v      # Detener y borrar modelo (forzar re-entrenamiento)
# ─────────────────────────────────────────────────────────────────────────────

services:
  skin-cancer-app:
    build: .
    image: skin-cancer-clasificador:latest
    container_name: skin-cancer-app

    ports:
      - "7860:7860"

    volumes:
      # Dataset: si ya está descargado en archive/ se usa directamente.
      # Si no existe, el entrypoint lo descarga automáticamente de Google Drive.
      - ./archive:/app/archive

      # Modelo: persiste entre reinicios en un volumen Docker nombrado.
      - model-store:/app/model

    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - GRADIO_LAUNCH_INBROWSER=false
      - MODEL_PATH=/app/model/modelo_mlp.pkl

      # Opcional: credenciales Kaggle (solo si Google Drive falla)
      #- KAGGLE_USERNAME=tu_usuario
      #- KAGGLE_KEY=tu_api_key

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7860/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  model-store:
