version: '3.8'

# ── Clasificador de Lesiones Cutáneas — UTN FRLP 2026 ─────────────────────────
#
# Flujo automático al hacer "docker-compose up --build":
#   1. Construye la imagen con las dependencias de Python.
#   2. Si no hay dataset → lo descarga de Kaggle (requiere credenciales abajo).
#   3. Si no hay modelo  → lo entrena (puede tardar varios minutos).
#   4. Lanza la app en   http://localhost:7860
#
# Comandos:
#   docker-compose up --build   # Primera vez
#   docker-compose up           # Veces siguientes (modelo ya entrenado)
#   docker-compose down         # Detener
#   docker-compose down -v      # Detener y borrar el modelo guardado
# ─────────────────────────────────────────────────────────────────────────────

services:
  skin-cancer-app:
    build: .
    image: skin-cancer-clasificador:latest
    container_name: skin-cancer-app

    ports:
      - "7860:7860"

    volumes:
      # Dataset: se monta desde el host.
      # Si no existe y se pasan las credenciales de Kaggle, se descarga solo.
      - ./archive:/app/archive

      # Modelo entrenado: persiste entre reinicios en un volumen Docker.
      - model-store:/app/model

    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - GRADIO_LAUNCH_INBROWSER=false
      - MODEL_PATH=/app/model/modelo_mlp.pkl

      # ── Credenciales de Kaggle (opcionales) ─────────────────────────────────
      # Descomentá y completá si querés que Docker descargue el dataset solo.
      # Obtenelas en: kaggle.com → Settings → API → Create New Token
      #- KAGGLE_USERNAME=tu_usuario_de_kaggle
      #- KAGGLE_KEY=tu_api_key_de_kaggle

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7860/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

# Volumen nombrado: el modelo persiste aunque hagas "docker-compose down"
# Para re-entrenar desde cero: docker-compose down -v
volumes:
  model-store:
