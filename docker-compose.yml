version: '3.8'

# ── Clasificador de Lesiones Cutáneas — UTN FRLP 2026 ─────────────────────────
#
# La primera vez que no haya modelo, el contenedor pregunta:
#   1) Descargar modelo pre-entrenado  (~13 MB, segundos)  ← recomendado
#   2) Descargar dataset + entrenar    (~3 GB + varios min)
#
# Comandos:
#   docker-compose run --rm skin-cancer-app   # Primera vez (con prompt interactivo)
#   docker-compose up                          # Siguientes veces (modelo ya guardado)
#   docker-compose down                        # Detener
#   docker-compose down -v                     # Borrar modelo (forzar nueva elección)
# ─────────────────────────────────────────────────────────────────────────────

services:
  skin-cancer-app:
    build: .
    image: skin-cancer-clasificador:latest
    container_name: skin-cancer-app

    # Necesario para el prompt interactivo en la primera ejecución
    stdin_open: true
    tty: true

    ports:
      - "7860:7860"

    volumes:
      # Dataset (solo necesario si se elige la opción 2 — entrenar desde cero)
      - ./archive:/app/archive

      # Modelo: persiste entre reinicios para no volver a descargar/entrenar
      - model-store:/app/model

    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - GRADIO_LAUNCH_INBROWSER=false
      - MODEL_PATH=/app/model/modelo_mlp.pkl

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7860/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  model-store:
